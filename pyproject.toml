[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gee_animation"
version = "0.2.0"
description = "Google Earth Engine NDVI forest timelapse generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=0.1.380",
    "Pillow>=10.0",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pyproj>=3.4",          # metric-CRS rendering (render.crs)
]

[project.optional-dependencies]
# pytest-asyncio: tests/test_webapp_jobs.py marks 22 `async def` tests with
# @pytest.mark.asyncio. Without the plugin pytest does not run them — it errors
# them with "async def functions are not natively supported", so a machine that
# merely happened to have it installed was the only place the job queue was
# ever tested. Strict mode (the default) is what we want: the markers are explicit.
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "nbformat>=5.9", "matplotlib>=3.5"]
shapefile = ["geopandas>=0.14"]
gui = ["gradio>=4"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "authlib>=1.3", "itsdangerous>=2.1"]
ml = ["rasterio>=1.3", "scikit-learn>=1.4", "joblib>=1.3"]   # sharpen: local (lst_rf on this machine)

[project.scripts]
gee-animation = "gee_animation.cli:main"
gee-animation-gui = "gee_animation.gui:main"
gee-animation-server = "gee_animation.webapp.app:main"

[tool.setuptools.packages.find]
include = ["gee_animation*"]

[tool.setuptools.package-data]
# Bundled DejaVu Sans (+ licence) so annotate/draw_info_bar can render "←"/"–"/"°"
# without depending on matplotlib (an optional extra) at runtime — see render._font.
gee_animation = ["fonts/*", "presets_aoi/*.geojson"]   # presets_aoi: footprints behind gui presets

[tool.pytest.ini_options]
markers = [
    "integration: hits live Google Earth Engine; skipped without credentials",
]
