name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run still in flight.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the package is developed against; pyproject's floor is 3.10.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and every extra the tests import
        # rasterio (ml) and fastapi (server) are imported at module level in
        # tests/test_sharpen_local.py and tests/test_webapp_*.py, so without
        # them the suite does not even collect. gradio (gui) and geopandas
        # (shapefile) sit behind pytest.importorskip, so leaving them out would
        # not fail — it would silently skip their tests, which is worse.
        run: pip install -e ".[dev,gui,server,ml,shapefile]"

      # TEMPORARY — remove before merge. test_colorbar_drops_mid_label_on_narrow_ramp
      # passes on macOS and fails here; this prints the text metrics that decide it.
      - name: Colorbar font-metrics diagnostic
        run: |
          python - <<'PY'
          import types
          import numpy as np
          import PIL, PIL.features
          from PIL import Image, ImageDraw
          from gee_animation.render import (add_colorbar, _annot_scale,
                                            _colorbar_ticks, _resolve_droppables)

          print("pillow", PIL.__version__,
                "freetype", PIL.features.version("freetype2"),
                "raqm", PIL.features.version("raqm"))

          w, h = 200, 300
          bar_w, bar_h = max(20, int(w * 0.4)), max(6, h // 20)
          x0 = max(4, w // 200)
          font, lw = _annot_scale(h)
          print("font", getattr(font, "path", font), "size", getattr(font, "size", "?"), "lw", lw)

          d = ImageDraw.Draw(Image.new("RGB", (1, 1)))
          line_h = d.textbbox((0, 0), "Ag", font=font)[3]
          y0 = 4 + line_h + max(2, lw)
          text_y = y0 + bar_h + lw + 2 + 1

          ticks = _colorbar_ticks(-10.0, 40.0, "°C")
          def xof(v): return x0 + (v - (-10.0)) / 50.0 * bar_w
          def bounds(t, xx, a):
              tb = d.textbbox((0, 0), t, font=font)
              tw = tb[2] - tb[0]
              return (xx, xx + tw) if a == "l" else (xx - tw, xx) if a == "r" else (xx - tw / 2, xx + tw / 2)

          bs = [bounds(l, xof(v), a) for v, l, a, _ in ticks]
          for (v, l, a, dr), b in zip(ticks, bs):
              print(f"  {l!r:10} anchor={a} droppable={dr} x={xof(v):7.2f} bounds=({b[0]:7.2f},{b[1]:7.2f})")
          gap = max(2, lw * 2)
          print("gap", gap, "-> show", _resolve_droppables(ticks, bs, gap))

          cfg = types.SimpleNamespace(index="lst", viz_min=-10.0, viz_max=40.0,
                                      palette=["#0000ff", "#ff0000"])
          out = add_colorbar(np.zeros((h, w, 3), np.uint8), cfg)
          band = out[text_y:text_y + 40]
          cols = np.nonzero(band.sum(axis=(0, 2)))[0]
          print("text_y", text_y, "ink columns", cols.tolist())
          PY

      - name: Unit tests
        # The one integration test hits live Earth Engine and needs credentials
        # no runner has. It is deselected by its marker, not skipped by luck.
        run: python -m pytest -m "not integration" -q
