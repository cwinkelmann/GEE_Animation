# Example run configuration for gee-animation.
name: barnim_ndvi           # output basename -> out/barnim_ndvi.mp4 / .gif
project: hnee-331218        # Google Earth Engine project id

aoi:
  frame:                         # rectangle -> animation extent (aspect ratio preserved)
    bbox: [13.7, 52.8, 13.9, 52.95]   # [minLon, minLat, maxLon, maxLat]
  region:                        # polygon -> important region (cloud-filtered)
    geojson:                     # inline GeoJSON (or a file path string)
      type: Polygon
      coordinates: [[[13.75, 52.83], [13.85, 52.83], [13.85, 52.90], [13.75, 52.90], [13.75, 52.83]]]
  region_max_cloud_percent: 10   # keep scenes only if cloud over the region < 10%

start: "2022-05-01"         # inclusive
end: "2022-08-01"           # exclusive

sensor: sentinel2           # v1 supports: sentinel2
cadence: monthly            # v1 supports: monthly
max_cloud_percent: 60       # scene-level pre-filter before pixel masking
draw_region: true           # overlay the region polygon outline on each frame

ndvi:
  min: -0.2
  max: 0.9
  palette: ["#a1622f", "#e8d9a0", "#3b7a2a"]  # brown -> tan -> green

render:
  fps: 4
  scale: 20                 # metres/pixel (informational; dimensions drives size)
  dimensions: 768           # max width/height of each frame (drives thumbnail size)
