# Example run configuration for Landsat Land Surface Temperature (LST).
name: wne_lst               # output basename -> out/wne_lst.mp4 / .gif
project: hnee-331218        # Google Earth Engine project id

aoi:
  # AOIs accept bbox, geojson (inline dict or path), or shapefile (auto-reprojected
  # to EPSG:4326; needs the `shapefile` extra: pip install -e ".[shapefile]").
  frame:                         # rectangle -> animation extent (aspect ratio preserved)
    shapefile: docs/aoi/wne/frame_timelaps_wne.shp
  region:                        # polygon -> important region (cloud-filtered + outlined)
    shapefile: docs/aoi/wne/wne.shp    # Grumsin world-heritage beech forest polygon
  region_max_cloud_percent: 20   # LST requires relaxed threshold; fewer Landsat scenes available

start: "2022-05-01"         # inclusive
end: "2022-09-01"           # exclusive (widened window for Landsat scene availability)

sensor: landsat             # Landsat collection
index: lst                  # Land Surface Temperature (Landsat-only)
cadence: monthly            # v1 supports: monthly
max_cloud_percent: 60       # scene-level pre-filter before pixel masking
draw_region: true           # overlay the region polygon outline on each frame

# Fixed viz range for cross-frame comparability. This one suits the summer window
# (May-Sept); a single fixed range can't fit both a cool April and a hot July, so
# pick it for your season (or use anomaly mode when available — see README).
viz:
  min: 10                   # deg C
  max: 40

render:
  fps: 4
  scale: 30                 # metres/pixel (informational; dimensions drives size)
  dimensions: 768           # capped to native 100 m thermal -> honest (blocky) pixels
  crs: auto                 # UTM from AOI centroid -> square pixels + correct scale bar
