# deploy/compose.yaml — carrot.aisl.c4ds.hnee.de
services:
  app:
    build: ..
    command: ["gee-animation-server"]
    env_file: .env
    environment:
      GEE_OAUTH_REDIRECT_URI: https://carrot.aisl.c4ds.hnee.de/oauth2/callback
      # GEE_OAUTH_CLIENT_ID / _SECRET and GEE_COOKIE_SECRET come from .env
      # Gradio copies every file a handler returns (mp4, gif, zip, each frame PNG) into
      # this directory. Its default is /tmp/gradio on the container's writable layer:
      # outside both volumes and outside retention. Inside the cache volume the copies
      # sit on mounted storage AND the server's sweeper ages them out with the runs.
      # Server-only, hence here and not in the image: the single-operator container has
      # no sweeper, so for it a persistent directory would only grow (see Dockerfile).
      GRADIO_TEMP_DIR: /data/cache/gradio-tmp
    volumes:
      - out:/data/out
      - cache:/data/cache
    expose: ["7860"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    environment:
      # Inert by default (the Caddyfile uses a file-based cert). Only used if you switch
      # to DNS-01 with a Caddy built with your provider plugin. Substituted from deploy/.env.
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The Caddyfile's active `tls` line expects these two files. Put the cert and key
      # from the HNEE internal CA next to this file, then uncomment:
      # - ./carrot.crt:/etc/caddy/carrot.crt:ro
      # - ./carrot.key:/etc/caddy/carrot.key:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes: { out: {}, cache: {}, caddy_data: {} }
