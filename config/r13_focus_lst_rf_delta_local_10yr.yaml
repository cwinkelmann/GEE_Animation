# Spandauer Forst, Revier 13 (Berlin): the second Tegel footprint, same treatment as
# the R12 config r12_focus_lst_rf_delta_local_10yr. Footprint: R13_footprint.gpkg (1,033 ha, three parts)
# simplified to 5 m as docs/aoi/r13/r13_footprint.geojson (188 vertices).
name: r13_focus_lst_rf_delta_local_10yr
project: hnee-331218
title: Spandauer Forst, Revier 13
subtitle: "RF-sharpened · Δ vs footprint mean"
aoi:
  frame: { bbox: [13.1330, 52.5582, 13.2168, 52.6024] }   # footprint bounds + 0.4 km, 5.7 x 4.9 km
  region: { geojson: docs/aoi/r13/r13_footprint.geojson }
  region_max_cloud_percent: 20
start: "2017-01-01"
end: "2026-09-01"
sensor: landsat
index: lst_rf
cadence: monthly
max_cloud_percent: 70
draw_region: true
missions: [L8, L9]
metadata: false
sharpen: local                 # EE exports composites; the forest trains here (sharpen_local)
region_only: true              # mask outside the footprint (renders as no-data grey)
relative: region_mean          # each frame = value − its own footprint mean, in K

pool_years: [2017, 2026]
pool_strategy: gap_fill

viz:
  min: -3.0
  max: 3.0                    # K; symmetric so the ramp's centre is the footprint mean
  palette: ['#2166ac', '#67a9cf', '#d1e5f0', '#f7f7f7', '#fddbc7', '#ef8a62', '#b2182b']

render:
  fps: 6
  interpolate: 10
  interpolate_mode: auto
  scale: 20
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "match"               # canvas follows the near-square footprint extent
  upscale: lanczos
  region_line_width: 5
  quality: 9
  raw_frames: true
  geotiffs: true                 # the delta field itself, per observed month
