# Grumsin Beech Forest: RF-sharpened surface temperature INSIDE the reserve, each
# month as its departure from that month's reserve mean (K) -- the Grumsin
# counterpart of r12_focus_lst_rf_delta_local_10yr. One forest per frame,
# trained on this machine; EE only exports two GeoTIFFs per month.
name: wne_focus_lst_rf_delta_2018_2026
project: hnee-331218
title: Grumsin Beech Forest
subtitle: "Δ vs reserve mean"          # short: line 2 is shared with the provenance caveats
aoi:
  frame: { bbox: [13.8634, 52.9713, 13.9299, 53.0008] }   # reserve bounds + 0.4 km, 4.5 x 3.3 km
  region: { shapefile: docs/aoi/wne/wne.shp }
  region_max_cloud_percent: 20
start: "2018-01-01"
end: "2026-08-01"
sensor: landsat
index: lst_rf
cadence: monthly
max_cloud_percent: 70
draw_region: true
missions: [L8, L9]
metadata: false
sharpen: local                 # EE exports composites; the forest trains here (sharpen_local)
region_only: true              # mask outside the footprint (renders as no-data grey)
relative: region_mean          # each frame = value − its own footprint mean, in K

pool_years: [2018, 2026]
pool_strategy: gap_fill

viz:
  min: -3.0
  max: 3.0                    # K; symmetric so the ramp's centre is the footprint mean
  palette: ['#2166ac', '#67a9cf', '#d1e5f0', '#f7f7f7', '#fddbc7', '#ef8a62', '#b2182b']

render:
  fps: 6
  interpolate: 10
  interpolate_mode: auto
  scale: 20
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "match"               # canvas follows the near-square footprint extent
  upscale: lanczos
  region_line_width: 5
  quality: 9
  raw_frames: true
  geotiffs: true                 # the delta field itself, per observed month
