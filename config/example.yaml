# Example run configuration for gee-animation.
name: wne_ndvi              # output basename -> out/wne_ndvi.mp4 / .gif
project: hnee-331218        # Google Earth Engine project id

aoi:
  # AOIs accept bbox, geojson (inline dict or path), or shapefile (auto-reprojected
  # to EPSG:4326; needs the `shapefile` extra: pip install -e ".[shapefile]").
  frame:                         # rectangle -> animation extent (aspect ratio preserved)
    shapefile: docs/aoi/wne/frame_timelaps_wne.shp
  region:                        # polygon -> important region (cloud-filtered + outlined)
    shapefile: docs/aoi/wne/wne.shp    # Grumsin world-heritage beech forest polygon
  region_max_cloud_percent: 10   # keep scenes only if cloud over the region < 10%

start: "2022-05-01"         # inclusive
end: "2022-08-01"           # exclusive

sensor: sentinel2           # v1 supports: sentinel2, landsat
index: ndvi                 # v1 supports: ndvi (sentinel2/landsat), lst (landsat)
cadence: monthly            # v1 supports: monthly
max_cloud_percent: 60       # scene-level pre-filter before pixel masking
draw_region: true           # overlay the region polygon outline on each frame

render:
  fps: 4
  scale: 20                 # metres/pixel (informational; dimensions drives size)
  dimensions: 768           # max width/height of each frame (drives thumbnail size)
  crs: auto                 # UTM from AOI centroid -> square pixels + correct scale bar
  # region_line_width: 4      # region outline core width in px (default: max(2, h/430))
  workers: 4                # concurrent thumbnail fetches (default 4; EE throttles
                            # beyond ~4, so more is slower). 1 = serial, for debugging.
                            # Also sizes the pool that writes the per-frame PNGs.
  # gif: false                # skip the GIF (default true). The MP4 is always written;
                            # the GIF is a 1280px preview and the slowest encode of a
                            # run (~3-5 s for 22 frames, half of it colour quantising).
  # frames: false             # skip the per-frame PNGs (default true) — another ~4 s
                            # for 22 frames at 1080p. Note the GUI's frame gallery and
                            # ZIP download are built from these.
  # cache: false              # disable the on-disk cache of raw thumbnail bytes
  # cache_dir: /path/to/cache # default: $GEE_ANIMATION_CACHE_DIR, else the platform
                            # user cache dir (~/.cache/gee_animation/thumbs; on macOS
                            # ~/Library/Caches/gee_animation/thumbs). Clear it with:
                            #   python -c "from gee_animation import cache; cache.clear()"
