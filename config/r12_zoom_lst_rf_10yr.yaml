# Tegeler Forst, Revier 12: RF-SHARPENED surface temperature on the zoomed frame
# (footprint + 0.4 km). EXPERIMENTAL product lst_rf -- the answer to "does the
# 20 m field look better than the 100 m blocks of r12_zoom_lst_pretty_10yr".
#
# No harmonic smoothing (validate() refuses it with lst_rf); instead gap_fill
# pooling borrows a donor year for months without a usable Landsat pass, exactly
# as the NDVI showcase does. Same look otherwise: turbo palette, 15-45 C, 6 fps.
#
# A pixel_grid variant is a free cache hit: at 4.7 km / 20 m = 235 cells across
# the canvas each cell is ~8 px, so the mesh is dense -- try it, but expect haze.
name: r12_zoom_lst_rf_10yr
project: hnee-331218
title: Tegeler Forst, Revier 12
subtitle: "Surface temperature · RF-sharpened to 20 m"
aoi:
  frame: { bbox: [13.2162, 52.5680, 13.2862, 52.6102] }   # footprint bounds + 0.4 km, 4.7 x 4.7 km
  region: { geojson: docs/aoi/r12/r12_footprint.geojson }
  region_max_cloud_percent: 20
start: "2017-01-01"
end: "2026-09-01"
sensor: landsat
index: lst_rf
cadence: monthly
max_cloud_percent: 70
draw_region: true
missions: [L8, L9]
metadata: false

pool_years: [2017, 2026]
pool_strategy: gap_fill

viz:
  min: 15.0
  max: 45.0
  palette: ['#30123b', '#4145ab', '#4675ed', '#39a2fc', '#1bcfd4', '#24eca6',
            '#61fc6c', '#a4fc3b', '#d1e834', '#f3c63a', '#fe9b2d', '#f36315',
            '#d93806', '#b11901', '#7a0402']

render:
  fps: 6
  interpolate: 10
  interpolate_mode: auto
  scale: 20
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "match"               # canvas follows the near-square footprint extent
  upscale: lanczos
  region_line_width: 5
  quality: 9
  raw_frames: true
  geotiffs: true                 # the sharpened field itself, for GIS checks
