# WNE DATA-ONLY run: monthly EVI composites over the zoomed footprint frame,
# no gap-filling (every frame is real data for its own month), GeoTIFF per month,
# no pictures. Used by docs/experiments/windthrow/index_drops.py.
name: wne_data_evi
project: hnee-331218
title: Grumsin Beech Forest
subtitle: Berlin, Germany
aoi:
  frame: { bbox: [13.8634, 52.9713, 13.9299, 53.0008] }
  region: { shapefile: docs/aoi/wne/wne.shp }
  region_max_cloud_percent: 20
start: "2018-01-01"
end: "2026-08-01"
sensor: sentinel2
index: evi
cadence: monthly
max_cloud_percent: 70
draw_region: true


render:
  fps: 1
  interpolate: 0
  scale: 10
  dimensions: 480
  crs: auto
  upscale: nearest
  gif: false
  frames: false
  raw_frames: false
  geotiffs: true
