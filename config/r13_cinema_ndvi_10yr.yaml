# Spandauer Forst, Revier 13 (Berlin): the second Tegel footprint, same treatment as
# the R12 config r12_cinema_ndvi_10yr. Footprint: R13_footprint.gpkg (1,033 ha, three parts)
# simplified to 5 m as docs/aoi/r13/r13_footprint.geojson (188 vertices).
name: r13_cinema_ndvi_10yr
project: hnee-331218
title: Spandauer Forst, Revier 13
subtitle: Berlin, Germany
aoi:
  frame: { bbox: [13.0504, 52.5482, 13.2994, 52.6124] }   # footprint + 1.5 km, reshaped to 2.373: 16.8 x 7.1 km
  region: { geojson: docs/aoi/r13/r13_footprint.geojson }
  region_max_cloud_percent: 20
start: "2017-01-01"
end: "2026-09-01"
sensor: sentinel2
index: ndvi
cadence: monthly
max_cloud_percent: 70
draw_region: true

pool_years: [2017, 2026]
pool_strategy: gap_fill

render:
  fps: 2
  interpolate: 10
  interpolate_mode: auto
  scale: 10
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "16:9"
  upscale: lanczos
  region_line_width: 5
  quality: 8
  raw_frames: true               # map-only image per observed month
  geotiffs: true                 # georeferenced float export per observed month
