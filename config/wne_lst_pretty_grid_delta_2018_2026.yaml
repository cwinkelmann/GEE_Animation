# Grumsin control: the wne_lst_pretty_grid_2018_2026 cut shown as each frame's
# departure from the footprint's own mean, -3..+3 K on the diverging ramp --
# the control twin of r12_zoom_lst_pretty_10yr_grid_delta. In an undamaged
# stand the cells should stay near zero all decade.
# Never chunk this run (smooth: harmonic fits one curve across the whole period).
name: wne_lst_pretty_grid_delta_2018_2026
project: ag-dataplatform
title: Grumsin Beech Forest
subtitle: "Surface temperature · Δ vs footprint mean · 100 m grid"
aoi:
  frame: { bbox: [13.7311, 52.9440, 14.0623, 53.0280] }  # 22.2 x 9.35 km fills the 16:9 place box
  region: { shapefile: docs/aoi/wne/wne.shp }
  region_max_cloud_percent: 20
start: "2018-01-01"
end: "2026-08-01"
sensor: landsat
index: lst
cadence: monthly
max_cloud_percent: 70
draw_region: true
missions: [L8, L9]
smooth: harmonic
harmonics: 2
metadata: false
relative: region_mean
viz:
  min: -3.0
  max: 3.0
  palette:
  - '#2166ac'
  - '#67a9cf'
  - '#d1e5f0'
  - '#f7f7f7'
  - '#fddbc7'
  - '#ef8a62'
  - '#b2182b'

render:
  fps: 2
  interpolate: 5
  interpolate_mode: auto
  scale: 10
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "16:9"
  upscale: nearest
  region_line_width: 5
  quality: 8
  raw_frames: false
  geotiffs: false
  pixel_grid: true
