# Sentinel-2 NDRE (red-edge / chlorophyll) over the WNE AOIs.
name: wne_ndre
project: hnee-331218

aoi:
  frame:  { shapefile: docs/aoi/wne/frame_timelaps_wne.shp }
  region: { shapefile: docs/aoi/wne/wne.shp }
  region_max_cloud_percent: 10

sensor: sentinel2
index: ndre
start: "2022-05-01"
end: "2022-08-01"
cadence: monthly
max_cloud_percent: 60
draw_region: true
render: { fps: 4, scale: 20, dimensions: 768 }
# viz omitted -> NDRE default (-0.2..1.0, brown->green)
