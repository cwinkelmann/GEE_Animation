# Tegeler Forst, Revier 12: the post-windthrow period only (May 2025 - Aug 2026),
# RF-sharpened surface temperature inside the footprint as departure from the
# footprint mean. One forest per frame, trained on this machine. Donor years for
# gap-filling are restricted to 2025-2026 so no pre-event canopy is borrowed.
name: r12_focus_lst_rf_delta_local_2025_2026
project: hnee-331218
title: Tegeler Forst, Revier 12
subtitle: "RF-sharpened · Δ vs footprint mean"
aoi:
  frame: { bbox: [13.2162, 52.5680, 13.2862, 52.6102] }   # footprint bounds + 0.4 km, 4.7 x 4.7 km
  region: { geojson: docs/aoi/r12/r12_footprint.geojson }
  region_max_cloud_percent: 20
start: "2025-05-01"
end: "2026-09-01"
sensor: landsat
index: lst_rf
cadence: monthly
max_cloud_percent: 70
draw_region: true
missions: [L8, L9]
metadata: false
sharpen: local                 # EE exports composites; the forest trains here (sharpen_local)
region_only: true              # mask outside the footprint (renders as no-data grey)
relative: region_mean          # each frame = value − its own footprint mean, in K

pool_years: [2025, 2026]         # donors only from the post-windthrow period
pool_strategy: gap_fill

viz:
  min: -3.0
  max: 3.0                    # K; symmetric so the ramp's centre is the footprint mean
  palette: ['#2166ac', '#67a9cf', '#d1e5f0', '#f7f7f7', '#fddbc7', '#ef8a62', '#b2182b']

render:
  fps: 3                          # 16 months: slower so each month reads
  interpolate: 10
  interpolate_mode: auto
  scale: 20
  dimensions: 1440
  crs: auto
  preset: 1080p
  aspect: "match"               # canvas follows the near-square footprint extent
  upscale: lanczos
  region_line_width: 5
  quality: 9
  raw_frames: true
  geotiffs: true                 # the delta field itself, per observed month
