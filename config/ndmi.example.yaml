# Sentinel-2 NDMI (moisture) over the WNE AOIs.
name: wne_ndmi
project: hnee-331218

aoi:
  frame:  { shapefile: docs/aoi/wne/frame_timelaps_wne.shp }
  region: { shapefile: docs/aoi/wne/wne.shp }
  region_max_cloud_percent: 10

sensor: sentinel2
index: ndmi
start: "2022-05-01"
end: "2022-08-01"
cadence: monthly
max_cloud_percent: 60
draw_region: true
render: { fps: 4, scale: 20, dimensions: 768 }
# viz omitted -> NDMI default (-0.5..0.8, brown->teal)
